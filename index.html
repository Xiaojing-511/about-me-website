<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HELLO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600;6..96,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="lang-switch" id="lang-switch" role="group" aria-label="语言">
      <span class="lang-switch-thumb" aria-hidden="true"></span>
      <button type="button" class="lang-opt" data-lang="zh" aria-pressed="true" aria-label="中文">中</button>
      <button type="button" class="lang-opt" data-lang="en" aria-pressed="false" aria-label="英文">EN</button>
    </div>
    <div class="viewport">
      <main class="stage" id="stage">
        <section class="col col-portrait" aria-label="人物形象">
          <img id="portrait" class="portrait" alt="" />
        </section>

        <section class="col col-copy">
          <div class="copy-top">
            <h1 id="intro-title"></h1>
            <p id="intro-subtitle" class="subtitle"></p>
            <div id="intro-paragraphs" class="paragraphs"></div>
          </div>
          <div class="education">
            <h2 id="education-title"></h2>
            <p id="education-detail"></p>
          </div>
        </section>

        <section class="col col-works" aria-label="作品">
          <h2 id="skills-label" class="skills-label"></h2>
          <article class="card" id="card">
            <img
              class="card-frame"
              src="images/mvp/ins%E5%8D%A1%E7%89%87.png"
              alt=""
              draggable="false"
            />
            <div class="card-media">
              <div class="card-track" id="card-track"></div>
            </div>
            <div class="dots" id="dots" role="group" aria-label="slides"></div>
            <div class="card-copy" id="card-copy">
              <p class="card-title" id="card-title"></p>
              <p class="card-note" id="card-note"></p>
            </div>
          </article>
          <div class="scan" id="scan">
            <div class="scan-track" id="scan-track"></div>
          </div>
        </section>
      </main>
    </div>
    <script src="js/content.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
